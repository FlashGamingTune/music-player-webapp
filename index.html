<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <h1>My Music Player</h1>
        <button id="themeToggle">🌙</button>
    </header>


    <div class="main-container">

        <aside class="sidebar">
            <h3>MENU</h3>
            <ul>
                <li>🏠 Home</li>
                <li>🎵 Library</li>
                <li>❤️ Favorites</li>
                <li>📂 Playlists</li>
            </ul>

            <h3>Recently Played</h3>
            <ul id="recentList"></ul>
        </aside>

        <section class="song-list">
            <h2>Songs</h2>

            <div class="upload-section">
                <input type="file" id="uploadInput" accept="audio/*">
                <button id="uploadBtn">Upload Song</button>
            </div>

            <div id="songsContainer"></div>

            <!-- <div class="song-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxXJjrkvibDjvNNQYS0muiuAG1YmWRmSpznA&s"
                    alt="Cover Page">
                <div>
                    <p>Song Name</p>
                    <span>Artist</span>
                </div>
            </div> -->
        </section>

    </div>

    <footer class="player-bar">

        <div class="player-left">
            <div class="mini-cover"></div>
            <div class="mini-info">
                <strong id="miniTitle">No song</strong>
            </div>
        </div>


        <div class="player-center">
            <button id="prevBtn">⏮</button>
            <button id="playBtn">▶</button>
            <button id="nextBtn">⏭</button>
            <button id="shuffleBtn">🔀</button>
            <button id="repeatBtn">🔁</button>

            <p id="timeDisplay">0:00 / 0:00</p>
            <input type="range" id="seekBar" value="0" min="0" max="100">
        </div>

        <div class="player-right">
            <input type="range" id="volumeSlider" value="1" min="0" max="1" step="0.01">
        </div>

    </footer>

    <audio id="audioPlayer"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
