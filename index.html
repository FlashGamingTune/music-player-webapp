<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <h1>My Music Player</h1>
    </header>

    <div class="main-container">

        <aside class="sidebar">
            <h3>MENU</h3>
            <ul>
                <li>🏠 Home</li>
                <li>🎵 Library</li>
                <li>❤️ Favorites</li>
                <li>📂 Playlists</li>
            </ul>
        </aside>

        <section class="song-list">
            <h2>Songs</h2>

            <input type="file" id="fileInput" accept="audio/*" multiple>

            <div id="songsContainer"></div>

            <div class="song-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxXJjrkvibDjvNNQYS0muiuAG1YmWRmSpznA&s"
                    alt="Cover Page">
                <div>
                    <p>Song Name</p>
                    <span>Artist</span>
                </div>
            </div>

            <div class="song-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxXJjrkvibDjvNNQYS0muiuAG1YmWRmSpznA&s"
                    alt="Cover Page">
                <div>
                    <p>Another Song</p>
                    <span>Artist</span>
                </div>
            </div>
            <div class="song-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxXJjrkvibDjvNNQYS0muiuAG1YmWRmSpznA&s"
                    alt="Cover Page">
                <div>
                    <p>Song 3</p>
                    <span>Artist</span>
                </div>
            </div>
        </section>

    </div>

    <footer class="player-bar">
        <button>⏮</button>
        <button id="playBtn">▶</button>
        <button>⏭</button>
    </footer>

    <audio id="audioPlayer"></audio>
    <script src="script.js"></script>

</body>

</html>
